workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 18
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Build iOS app
        script: |
          xcodebuild \
            -workspace ios/gymplusone.xcworkspace \
            -scheme gymplusone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/gymplusone.xcarchive \
            archive

    artifacts:
      - build/ios/ipa/*.ipa