workflows:
  ios-workflow:
    name: Expo iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 18
      groups:
        - credentials # This links your Codemagic web dashboard environment variables here
      vars:
        # Fallback to make sure Expo knows it's running in a non-interactive CI environment
        CI: "true"

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Generate Native iOS Project
        script: |
          # This configures your native project code without trying to run local pods
          npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods Remotely
        script: |
          # Codemagic will download the Mapbox SDK binary using your token variable here
          cd ios && pod install

      - name: Compile Standalone Development App
        script: |
          # This compiles the workspace directly into an installable application bundle
          xcodebuild -workspace ios/gym1111.xcworkspace \
                     -scheme gym1111 \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath $CM_BUILD_DIR/ios/gym1111.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $CM_BUILD_DIR/ios/*.xcarchive
      - ios/build/**/*.app
