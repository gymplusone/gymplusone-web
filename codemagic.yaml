workflows:
  ios-workflow:
    name: Expo iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 18

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Install EAS CLI
        script: npm install -g eas-cli

      - name: Build with EAS
        script: eas build -p ios --non-interactive

    artifacts:
      - "*.ipa"